const walkSegs=[]; // Pass 7 ribbon stay-on-path
function addWalkSeg(ax,az,bx,bz,half){walkSegs.push({ax,az,bx,bz,half});}

function nearestWalk(x,z){
  if(Math.hypot(x,z)<=LOCK.hubOuter+2.5) return {x,z,on:true,d:0};
  let best=1e9,bx=x,bz=z,on=false;
  const spd=Math.hypot(walkVelX,walkVelZ)||0;
  for(let i=0;i<walkSegs.length;i++){
    const s=walkSegs[i],dx=s.bx-s.ax,dz=s.bz-s.az,len2=dx*dx+dz*dz||1;
    let u=((x-s.ax)*dx+(z-s.az)*dz)/len2;u=u<0?0:u>1?1:u;
    const px=s.ax+dx*u,pz=s.az+dz*u,d=Math.hypot(x-px,z-pz);
    // Prefer segments aligned with travel — reduces corner chord shortcuts
    let score=d;
    if(spd>0.01){
      const len=Math.sqrt(len2),sx=dx/len,sz=dz/len;
      const align=Math.abs(walkVelX*sx+walkVelZ*sz); // 0..1
      score=d*(1.15-0.35*align);
    }
    if(score<best){best=score;bx=px;bz=pz;on=d<=s.half;}
  }
  return {x:bx,z:bz,on,d:Math.hypot(x-bx,z-bz)};
}
function pathRibbon(pts,width=6,mat=pathMat){
  if(pts.length<2)return;
  const curve=new THREE.CatmullRomCurve3(pts.map(([x,z])=>new THREE.Vector3(x,0.15,z)),false,'catmullrom',0.18);
  const segs=Math.max(20,pts.length*10);
  const hw=width/2;
  const pos=[],idx=[];
  for(let i=0;i<=segs;i++){
    const t=i/segs,p=curve.getPoint(t),tg=curve.getTangent(t);
    const sx=-tg.z,sz=tg.x,len=Math.hypot(sx,sz)||1;
    const nx=sx/len*hw,nz=sz/len*hw;
    pos.push(p.x-nx,0.16,p.z-nz,p.x+nx,0.16,p.z+nz);
  }
  for(let i=0;i<segs;i++){const a=i*2;idx.push(a,a+1,a+2,a+1,a+3,a+2);}
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  geo.setIndex(idx);geo.computeVertexNormals();
  scene.add(new THREE.Mesh(geo,mat));
  for(let i=0;i<segs;i++){
    const p0=curve.getPoint(i/segs),p1=curve.getPoint((i+1)/segs);
    addWalkSeg(p0.x,p0.z,p1.x,p1.z,hw+0.85);
  }
  [-1,1].forEach(side=>{
    const cpts=[];
    for(let i=0;i<=segs;i++){
      const t=i/segs,p=curve.getPoint(t),tg=curve.getTangent(t);
      const sx=-tg.z,sz=tg.x,len=Math.hypot(sx,sz)||1;
      cpts.push(new THREE.Vector3(p.x+side*sx/len*(hw+0.32),0.3,p.z+side*sz/len*(hw+0.32)));
    }
    scene.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(cpts),segs,0.2,5,false),stoneDark));
  });
}

(function wayChevrons(){
  const mat=new THREE.MeshLambertMaterial({color:0x8a4030});
  const stops=(ITINERARY.stops||[]).map(s=>walkById(s.walk)).filter(w=>w&&w.sign);
  function chevron(x,z,yaw){
    const g=new THREE.Group();
    const a=new THREE.Mesh(new THREE.BoxGeometry(0.9,0.06,0.28),mat);
    const b=a.clone(); a.position.set(0.25,0.04,0); a.rotation.y=0.45;

  }
  for(let i=0;i<stops.length-1;i++){
    const a=stops[i].sign, b=stops[i+1].sign;
    const hubA=[Math.sign(a.x||1)*22, Math.sign(a.z||1)*22];
    const hubB=[Math.sign(b.x||1)*22, Math.sign(b.z||1)*22];
    const path=[[a.x,a.z], hubA];
    if(hubA[0]!==hubB[0]||hubA[1]!==hubB[1]) path.push(hubB);
    path.push([b.x,b.z]);
    for(let k=0;k<path.length-1;k++){
      const x0=path[k][0],z0=path[k][1],x1=path[k+1][0],z1=path[k+1][1];
      const dist=Math.hypot(x1-x0,z1-z0);
      const n=Math.max(1,Math.floor(dist/18));
      for(let j=1;j<=n;j++){
        const t=j/(n+1);
        const x=x0+(x1-x0)*t, z=z0+(z1-z0)*t;
        if(Math.abs(x)<LOCK.spineWidth/2+0.5) continue; // keep off spine strip
        chevron(x,z,Math.atan2(x1-x0,z1-z0));
      }
    }
  }
})();

(function walkPathFurniture(){

  function place(x,z,yaw,kind){

      const dx=(x-cx)/(rx+1.5), dz=(z-cz)/(rz+1.5); return dx*dx+dz*dz<=1;
    })) return;

  function alongSeg(ax,az,bx,bz,step,offset){
    const dx=bx-ax, dz=bz-az, len=Math.hypot(dx,dz)||1;
    const ux=dx/len, uz=dz/len, px=-uz, pz=ux;
    const yaw=Math.atan2(dx,dz);
    const pts=[];
    for(let d=step;d<len-step*0.4;d+=step){
      const x=ax+ux*d+px*offset, z=az+uz*d+pz*offset;
      pts.push({x,z,yaw});
    }
    return pts;
  }
  function shorePt(L,a,m=3.6){return [L.x+Math.cos(a)*(L.rx+m), L.z+Math.sin(a)*(L.rz+m)];}
  function angTo(L,x,z){return Math.atan2(z-L.z,x-L.x);}

    // furniture near walk sign (offset off spine)
    if(walk.sign){
      const sx=walk.sign.x, sz=walk.sign.z;
      const side=Math.sign(sx||1);
      place(sx+side*3.2, sz+2.5, walk.sign.yaw||0, 'lamp');
      place(sx+side*4.0, sz-2.0, walk.sign.yaw||Math.PI/2, 'bench');
      place(sx+side*2.4, sz+5.0, 0, 'trash');

      const A=walkLake(ia), B=walkLake(ib);

    });

      const L=walkLake(walk.lakes[0]);

      const end=walk.spur;

  const base=new THREE.Mesh(new THREE.BoxGeometry(b.w+1.05,0.48,b.d+1.05),trim);base.position.y=0.24;
  const lower=new THREE.Mesh(new THREE.BoxGeometry(b.w,b.h*0.56,b.d),mat);lower.position.y=0.42+b.h*0.28;
  const upper=new THREE.Mesh(new THREE.BoxGeometry(b.w*0.9,b.h*0.36,b.d*0.88),mat);upper.position.y=0.42+b.h*0.56+b.h*0.18;
  const belt=new THREE.Mesh(new THREE.BoxGeometry(b.w+0.35,0.22,b.d+0.35),trim);belt.position.y=0.42+b.h*0.56;
  const cornice=new THREE.Mesh(new THREE.BoxGeometry(b.w*1.08,0.32,b.d*1.08),trim);cornice.position.y=0.42+b.h-0.02;
  const roofA=new THREE.Mesh(new THREE.BoxGeometry(b.w*0.96,0.18,b.d*1.02),trim);roofA.position.set(0,0.42+b.h+0.28,0);roofA.rotation.x=0.18;
  const roofB=roofA.clone();roofB.rotation.x=-0.18;
  g.add(base,lower,upper,belt,cornice,roofA,roofB);
  addPortico(g,b,trim,mat);
  const zFront=b.d/2+0.02,zBack=-b.d/2-0.02,xR=b.w/2+0.02,xL=-b.w/2-0.02;
  for(const wx of [-b.w*0.32,b.w*0.32]){
    addWindowBay(g,wx,2.15,zFront,'z+',mat,trim,glass);
    addWindowBay(g,wx*0.9,5.35,zFront*0.9,'z+',mat,trim,glass);
    addWindowBay(g,wx,2.15,zBack,'z-',mat,trim,glass);
  }
  for(const wz of [-b.d*0.22,b.d*0.22]){
    addWindowBay(g,xR,2.15,wz,'x+',mat,trim,glass);
    addWindowBay(g,xL,2.15,wz,'x-',mat,trim,glass);
    addWindowBay(g,xR*0.9,5.35,wz*0.85,'x+',mat,trim,glass);
  }
  const pilH=b.h*0.56, pilY=0.42+b.h*0.28;
  for(const sx of [-b.w/2,0,b.w/2]) addPilaster(g,sx,pilY,zFront+0.12,pilH,trim,true);
  for(const sx of [-b.w/2,b.w/2]) addPilaster(g,sx,pilY,zBack-0.12,pilH,trim,true);
  for(const sz of [-b.d/2,b.d/2]) addPilaster(g,xR+0.12,pilY,sz,pilH,trim,false);
  const steps=new THREE.Mesh(new THREE.BoxGeometry(4.6,0.28,1.35),new THREE.MeshLambertMaterial({color:0xb9b3a8}));
  steps.position.set(0,0.14,b.d/2+2.05);
  const step2=steps.clone();step2.scale.set(0.82,1,0.7);step2.position.z=b.d/2+1.45;step2.position.y=0.28;
  g.add(steps,step2);
}
BUILDINGS.forEach(b=>{if(b.sku==='kiosk')addKiosk(b);else if(b.sku==='pavilion')addPavilion(b);else addHall(b);});
// Pass 37 — evening window glow on SKUs (footprints unmoved)
(function windowGlowPass(){
  const glow=new THREE.MeshLambertMaterial({color:0xf0d090, emissive:0xc9a050, emissiveIntensity:0.65});
  BUILDINGS.forEach(b=>{
    const n=b.sku==='hall'?6:b.sku==='pavilion'?4:2;
    for(let i=0;i<n;i++){
      const face=i%4;
      const u=(Math.floor(i/4)+0.5)/(Math.ceil(n/4)+0.01);
      let x=0,z=0,sx=0.7,sz=0.08;
      if(face===0){x=(u-0.5)*b.w*0.7;z=b.d/2+0.04;sx=Math.min(1.4,b.w*0.22);sz=0.08;}
      else if(face===1){x=(u-0.5)*b.w*0.7;z=-b.d/2-0.04;sx=Math.min(1.4,b.w*0.22);sz=0.08;}
      else if(face===2){z=(u-0.5)*b.d*0.7;x=b.w/2+0.04;sx=0.08;sz=Math.min(1.2,b.d*0.22);}
      else{z=(u-0.5)*b.d*0.7;x=-b.w/2-0.04;sx=0.08;sz=Math.min(1.2,b.d*0.22);}
      const pane=new THREE.Mesh(new THREE.BoxGeometry(sx,0.9,sz),glow);
      pane.position.set(b.x+x*Math.cos(b.yaw||0)-z*Math.sin(b.yaw||0), 1.35+((i%3)*0.15), b.z+x*Math.sin(b.yaw||0)+z*Math.cos(b.yaw||0));
      scene.add(pane);
    }
  });
})();

const avatar=new THREE.Group();
const body=new THREE.Mesh(new THREE.CapsuleGeometry(0.38,1.05,4,8),new THREE.MeshLambertMaterial({color:0xc9b48a}));body.position.y=0.9;
const head=new THREE.Mesh(new THREE.SphereGeometry(0.28,12,12),new THREE.MeshLambertMaterial({color:0xe8d7b0}));head.position.y=1.72;
avatar.add(body,head);scene.add(avatar);
const keys={};
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyV')cycle();});
addEventListener('keyup',e=>keys[e.code]=false);
const modes=['walk','third','above'];
const btns={walk:document.getElementById('b1'),third:document.getElementById('b3'),above:document.getElementById('bM')};
function setMode(m){mode=m;Object.keys(btns).forEach(k=>btns[k].classList.toggle('on',k===m));scene.fog.far=m==='above'?1800:900;camera.fov=m==='above'?62:70;camera.updateProjectionMatrix();document.getElementById('lift').style.display=m==='above'?'flex':'none';if(m==='above'){drone.set(pos.x,90,pos.z+12);droneYaw=yaw;dronePitch=-0.72;droneVel.set(0,0,0);}}
function cycle(){setMode(modes[(modes.indexOf(mode)+1)%3]);}
btns.walk.onclick=()=>setMode('walk');btns.third.onclick=()=>setMode('third');btns.above.onclick=()=>setMode('above');
if(location.hash==='#drone')setMode('above');
let look=false,lx=0,ly=0;
canvas.addEventListener('pointerdown',e=>{look=true;lx=e.clientX;ly=e.clientY;canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointerup',()=>look=false);
canvas.addEventListener('pointermove',e=>{if(!look)return;const dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;if(mode==='above'){droneYaw-=dx*0.0045;dronePitch-=dy*0.0035;dronePitch=Math.max(-1.45,Math.min(0.35,dronePitch));}else{yaw-=dx*0.005;pitch-=dy*0.005;pitch=Math.max(-1.15,Math.min(1.15,pitch));}});
canvas.addEventListener('wheel',e=>{if(mode!=='above')return;drone.y=Math.max(8,Math.min(420,drone.y+e.deltaY*0.12));},{passive:true});
const pad=document.getElementById('pad'),knob=document.getElementById('knob');const stick={x:0,z:0};
function setStick(cx,cy){const r=pad.getBoundingClientRect();let dx=(cx-(r.left+r.width/2))/42,dy=(cy-(r.top+r.height/2))/42;const m=Math.hypot(dx,dy)||1;if(m>1){dx/=m;dy/=m;}stick.x=dx;stick.z=dy;knob.style.left=39+dx*28+'px';knob.style.top=39+dy*28+'px';}
function clearStick(){stick.x=0;stick.z=0;knob.style.left='39px';knob.style.top='39px';}
pad.addEventListener('pointerdown',e=>{e.stopPropagation();setStick(e.clientX,e.clientY);pad.setPointerCapture(e.pointerId);});
pad.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')setStick(e.clientX,e.clientY);});
pad.addEventListener('pointerup',clearStick);pad.addEventListener('pointercancel',clearStick);
function hold(el,dir){const on=e=>{e.preventDefault();lift=dir;};const off=()=>{if(lift===dir)lift=0;};el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);el.addEventListener('pointerleave',off);el.addEventListener('pointercancel',off);}
hold(document.getElementById('up'),1);hold(document.getElementById('dn'),-1);
const landEl=document.getElementById('land'),distEl=document.getElementById('dist');
function whichLand(x,z){if(Math.hypot(x,z)<36)return 'The Pocket · Hub';if(z>40&&Math.abs(x)<20)return 'The Pocket · Corridor';if(x<-60)return 'The Block';if(x>70)return 'The Board';if(z<-50)return 'After Hours';return 'The Pocket';}
const clock=new THREE.Clock();
function tick(){
  const dt=Math.min(clock.getDelta(),0.05);
  let mx=stick.x,mz=stick.z;
  if(keys.KeyW)mz-=1;if(keys.KeyS)mz+=1;if(keys.KeyA)mx-=1;if(keys.KeyD)mx+=1;
  const len=Math.hypot(mx,mz);
  if(mode==='above'){
    const fx=-Math.sin(droneYaw),fz=-Math.cos(droneYaw),rx=Math.cos(droneYaw),rz=-Math.sin(droneYaw);
    const spd=(keys.ShiftLeft||keys.ShiftRight)?DRONE_FAST:DRONE;
    let tx=0,tz=0,ty=0;
    if(len>0){mx/=len;mz/=len;tx=(fx*-mz+rx*mx)*spd;tz=(fz*-mz+rz*mx)*spd;}
    if(keys.KeyQ||keys.Space||lift>0)ty+=spd*0.55;
    if(keys.KeyE||keys.ControlLeft||lift<0)ty-=spd*0.55;
    droneVel.x+=(tx-droneVel.x)*Math.min(1,dt*6);
    droneVel.z+=(tz-droneVel.z)*Math.min(1,dt*6);
    droneVel.y+=(ty-droneVel.y)*Math.min(1,dt*6);
    drone.x+=droneVel.x*dt;drone.z+=droneVel.z*dt;drone.y=Math.max(8,Math.min(420,drone.y+droneVel.y*dt));
  }else if(len>0){
    mx/=len;mz/=len;const fx=-Math.sin(yaw),fz=-Math.cos(yaw),rx=Math.cos(yaw),rz=-Math.sin(yaw);
    const stepX=(fx*-mz+rx*mx)*WALK*dt,stepZ=(fz*-mz+rz*mx)*WALK*dt;
    walkVelX=stepX;walkVelZ=stepZ;
    const nx=pos.x+stepX,nz=pos.z+stepZ;
    if(inStadium(nx,nz)){
      // Pass 10: hard snap when off ribbon — soft 0.6 blend was cutting corners
      const w=nearestWalk(nx,nz);
      if(w.on){pos.x=nx;pos.z=nz;}
      else if(w.d<5){pos.x=w.x;pos.z=w.z;}
    }
  }
  pos.y=EYE;avatar.position.set(pos.x,0,pos.z);avatar.rotation.y=yaw;avatar.visible=mode!=='walk';
  if(mode==='walk'){camera.position.copy(pos);camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;}
  else if(mode==='third'){camera.position.set(pos.x+Math.sin(yaw)*5.2,pos.y+2.1+pitch*-1.2,pos.z+Math.cos(yaw)*5.2);camera.lookAt(pos.x,pos.y-0.1,pos.z);}
  else{camera.position.copy(drone);camera.rotation.order='YXZ';camera.rotation.y=droneYaw;camera.rotation.x=dronePitch;}
  const hx=mode==='above'?drone.x:pos.x,hz=mode==='above'?drone.z:pos.z;
  landEl.textContent=whichLand(hx,hz)+' · '+(mode==='walk'?'WALK':mode==='third'?'3RD':'DRONE');
  distEl.textContent=mode==='above'?('Alt '+drone.y.toFixed(0)+' m · hub '+Math.hypot(drone.x,drone.z).toFixed(0)+' m'):('Hub '+Math.hypot(pos.x,pos.z).toFixed(0)+' m');
  renderer.render(scene,camera);requestAnimationFrame(tick);
}
tick();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
