<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rydelic Park — Kit Walk</title>
<style>
  html,body{margin:0;height:100%;background:#0b0b0c;color:#f4efe6;font-family:-apple-system,BlinkMacSystemFont,sans-serif;overflow:hidden}
  #c{display:block;width:100%;height:100%}
  .hud{position:fixed;left:16px;bottom:16px;z-index:2;padding:12px 14px;border-radius:12px;
    background:rgba(18,16,14,.55);border:1px solid rgba(201,180,138,.28);backdrop-filter:blur(10px);
    font-size:12px;letter-spacing:.04em;line-height:1.45;max-width:280px}
  .hud b{color:#c9b48a;font-weight:600}
  .top{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:2;font-size:11px;letter-spacing:.35em;text-transform:uppercase;color:#c9b48a}
  a{color:#c9b48a}
</style>
</head>
<body>
<div class="top">Rydelic Park · kit v1</div>
<canvas id="c"></canvas>
<div class="hud">
  <div><b>WASD</b> walk · <b>mouse</b> look (click to lock)</div>
  <div>1 unit = 1 m · walk 1.34 m/s · eye 1.72 m</div>
  <div>Oval A=380 · B=230 · spawn Gate → Pocket</div>
  <div style="margin-top:6px"><a href="../">← Octave landing</a> · see <b>KIT.md</b></div>
</div>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

// KIT constants — change only via park/KIT.md
const A = 380, B = 230;
const WALK = 1.34;
const EYE = 1.72;
const GATE = new THREE.Vector3(0, EYE, B + 40);

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0b0c);
scene.fog = new THREE.Fog(0x0b0b0c, 80, 900);

const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 2000);
camera.position.copy(GATE);

const hemi = new THREE.HemisphereLight(0xb8c4d4, 0x2a241c, 0.85);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xf0e2c4, 0.65);
sun.position.set(-120, 220, 80);
scene.add(sun);

// Ground
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(Math.max(A, B) + 80, 64),
  new THREE.MeshStandardMaterial({ color: 0x1a1714, roughness: 0.95 })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

// Oval rail (ellipse path)
const railPts = [];
for (let i = 0; i <= 128; i++) {
  const t = (i / 128) * Math.PI * 2;
  railPts.push(new THREE.Vector3(Math.cos(t) * A, 0.4, Math.sin(t) * B));
}
const rail = new THREE.LineLoop(
  new THREE.BufferGeometry().setFromPoints(railPts),
  new THREE.LineBasicMaterial({ color: 0xc9b48a })
);
scene.add(rail);

// Soft rail bed
const railTube = new THREE.Mesh(
  new THREE.TorusGeometry(1, 0.35, 6, 64),
  new THREE.MeshStandardMaterial({ color: 0x3a342c, roughness: 0.9 })
);
// approximate oval with scaled torus
railTube.scale.set(A, 1, B);
railTube.rotation.x = Math.PI / 2;
railTube.position.y = 0.15;
scene.add(railTube);

// Path Gate → Hub (The Pocket at origin)
const pathShape = new THREE.Shape();
pathShape.moveTo(-4, -B - 40);
pathShape.lineTo(4, -B - 40);
pathShape.lineTo(6, 0);
pathShape.lineTo(-6, 0);
pathShape.closePath();
const pathGeo = new THREE.ShapeGeometry(pathShape);
const path = new THREE.Mesh(
  pathGeo,
  new THREE.MeshStandardMaterial({ color: 0x2c281f, roughness: 0.85 })
);
path.rotation.x = -Math.PI / 2;
path.position.y = 0.05;
scene.add(path);

// Hub plaza ring
const hub = new THREE.Mesh(
  new THREE.RingGeometry(18, 32, 48),
  new THREE.MeshStandardMaterial({ color: 0x2a261e, roughness: 0.88, side: THREE.DoubleSide })
);
hub.rotation.x = -Math.PI / 2;
hub.position.y = 0.06;
scene.add(hub);

// Water (simple ellipse pool near hub — kit layer, not IP)
const water = new THREE.Mesh(
  new THREE.CircleGeometry(14, 32),
  new THREE.MeshStandardMaterial({ color: 0x1a3038, metalness: 0.2, roughness: 0.35 })
);
water.rotation.x = -Math.PI / 2;
water.position.set(48, 0.07, -20);
scene.add(water);

// Tree massing — abstract dark clumps only
function treeClump(x, z, r = 8) {
  const m = new THREE.Mesh(
    new THREE.SphereGeometry(r, 10, 10),
    new THREE.MeshStandardMaterial({ color: 0x142016, roughness: 1 })
  );
  m.position.set(x, r * 0.55, z);
  m.scale.y = 0.7;
  scene.add(m);
}
for (let i = 0; i < 28; i++) {
  const t = (i / 28) * Math.PI * 2;
  const jitter = 12 + (i % 5) * 3;
  treeClump(Math.cos(t) * (A - jitter), Math.sin(t) * (B - jitter), 6 + (i % 4));
}

// Path curbs — human-scale edges along Gate → Hub (raised ~0.15 m, ~0.35 m wide)
const curbMat = new THREE.MeshStandardMaterial({ color: 0x4a4034, roughness: 0.82 });
const CURB_W = 0.35;
const CURB_H = 0.15;
function makePathCurb(xInnerGate, xInnerHub, outward) {
  // Shape XY → Extrude Z → rot -X → world XZ path with height in Y
  const o = outward; // -1 left, +1 right
  const shape = new THREE.Shape();
  const x0a = xInnerGate;
  const x0b = xInnerGate + o * CURB_W;
  const x1a = xInnerHub;
  const x1b = xInnerHub + o * CURB_W;
  // y of shape maps to -world Z after rot
  shape.moveTo(x0a, -(B + 40));
  shape.lineTo(x0b, -(B + 40));
  shape.lineTo(x1b, 0);
  shape.lineTo(x1a, 0);
  shape.closePath();
  const geo = new THREE.ExtrudeGeometry(shape, { depth: CURB_H, bevelEnabled: false });
  const mesh = new THREE.Mesh(geo, curbMat);
  mesh.rotation.x = -Math.PI / 2;
  mesh.position.y = 0.05;
  scene.add(mesh);
}
makePathCurb(-4, -6, -1);
makePathCurb(4, 6, 1);

// Hub ring thin curb (outer + inner lip)
function hubCurbRing(radius) {
  const t = new THREE.Mesh(
    new THREE.TorusGeometry(radius, 0.08, 6, 48),
    curbMat
  );
  t.rotation.x = Math.PI / 2;
  t.position.y = 0.14;
  scene.add(t);
}
hubCurbRing(18);
hubCurbRing(32);

// Gate volume — thick stone tunnel you walk through (not posts)
const gateStone = new THREE.MeshStandardMaterial({ color: 0x3a3228, roughness: 0.78 });
const gateStoneDark = new THREE.MeshStandardMaterial({ color: 0x2c261e, roughness: 0.85 });
const gateAccent = new THREE.MeshStandardMaterial({ color: 0x4a4032, roughness: 0.7 });
const GATE_Z = B + 34;       // tunnel center (spawn at B+40 looks through toward Pocket)
const GATE_DEPTH = 10;       // ~8–12 m deep
const GATE_OPEN_W = 7;       // clear opening width
const GATE_OPEN_H = 5.5;     // clear opening height
const WALL_T = 4.5;          // thick side walls
const GATE_H = 8.5;          // outer height
const OUTER_W = GATE_OPEN_W + WALL_T * 2; // ~16 m massing width

const gateGroup = new THREE.Group();
gateGroup.position.set(0, 0, GATE_Z);

// Left / right wall volumes (full depth)
const wallGeo = new THREE.BoxGeometry(WALL_T, GATE_H, GATE_DEPTH);
const wallL = new THREE.Mesh(wallGeo, gateStone);
wallL.position.set(-(GATE_OPEN_W / 2 + WALL_T / 2), GATE_H / 2, 0);
const wallR = new THREE.Mesh(wallGeo, gateStone);
wallR.position.set(GATE_OPEN_W / 2 + WALL_T / 2, GATE_H / 2, 0);
gateGroup.add(wallL, wallR);

// Roof / lintel slab over opening (full depth)
const roof = new THREE.Mesh(
  new THREE.BoxGeometry(GATE_OPEN_W + 0.4, GATE_H - GATE_OPEN_H, GATE_DEPTH),
  gateStone
);
roof.position.set(0, GATE_OPEN_H + (GATE_H - GATE_OPEN_H) / 2, 0);
gateGroup.add(roof);

// Floor threshold inside tunnel
const threshold = new THREE.Mesh(
  new THREE.BoxGeometry(GATE_OPEN_W, 0.2, GATE_DEPTH),
  gateStoneDark
);
threshold.position.set(0, 0.1, 0);
gateGroup.add(threshold);

// Outer / inner face frames (read as depth + arch mass)
function faceFrame(zLocal) {
  const g = new THREE.Group();
  // side returns
  const retGeo = new THREE.BoxGeometry(1.2, GATE_H + 0.4, 1.4);
  const retL = new THREE.Mesh(retGeo, gateAccent);
  retL.position.set(-(OUTER_W / 2 + 0.2), (GATE_H + 0.4) / 2, zLocal);
  const retR = retL.clone();
  retR.position.x = OUTER_W / 2 + 0.2;
  // crowning band
  const crown = new THREE.Mesh(
    new THREE.BoxGeometry(OUTER_W + 2.8, 1.1, 1.6),
    gateAccent
  );
  crown.position.set(0, GATE_H + 0.15, zLocal);
  // arched reveal as stepped soffit over opening
  const soffit = new THREE.Mesh(
    new THREE.BoxGeometry(GATE_OPEN_W + 1.2, 0.7, 1.2),
    gateStoneDark
  );
  soffit.position.set(0, GATE_OPEN_H + 0.15, zLocal);
  g.add(retL, retR, crown, soffit);
  return g;
}
gateGroup.add(faceFrame(-GATE_DEPTH / 2 + 0.3));
gateGroup.add(faceFrame(GATE_DEPTH / 2 - 0.3));

// Interior side liners (darker, read the tunnel)
const linerGeo = new THREE.BoxGeometry(0.35, GATE_OPEN_H, GATE_DEPTH - 0.8);
const linerL = new THREE.Mesh(linerGeo, gateStoneDark);
linerL.position.set(-(GATE_OPEN_W / 2 - 0.15), GATE_OPEN_H / 2, 0);
const linerR = linerL.clone();
linerR.position.x = GATE_OPEN_W / 2 - 0.15;
gateGroup.add(linerL, linerR);

scene.add(gateGroup);

// Hub marker (The Pocket) — abstract ring, no IP
const pocket = new THREE.Mesh(
  new THREE.TorusGeometry(6, 0.25, 8, 48),
  new THREE.MeshStandardMaterial({ color: 0xc9b48a, metalness: 0.4, roughness: 0.4 })
);
pocket.rotation.x = Math.PI / 2;
pocket.position.y = 1.2;
scene.add(pocket);

const controls = new PointerLockControls(camera, document.body);
scene.add(controls.getObject());
canvas.addEventListener('click', () => controls.lock());

const keys = {};
addEventListener('keydown', e => keys[e.code] = true);
addEventListener('keyup', e => keys[e.code] = false);

const vel = new THREE.Vector3();
const dir = new THREE.Vector3();
let prev = performance.now();

function tick(now) {
  requestAnimationFrame(tick);
  const dt = Math.min(0.05, (now - prev) / 1000);
  prev = now;
  if (controls.isLocked) {
    dir.set(0, 0, 0);
    if (keys['KeyW']) dir.z -= 1;
    if (keys['KeyS']) dir.z += 1;
    if (keys['KeyA']) dir.x -= 1;
    if (keys['KeyD']) dir.x += 1;
    if (dir.lengthSq() > 0) dir.normalize();
    vel.x = dir.x * WALK;
    vel.z = dir.z * WALK;
    controls.moveRight(vel.x * dt);
    controls.moveForward(-vel.z * dt);
    controls.getObject().position.y = EYE;
  }
  pocket.rotation.z += dt * 0.25;
  renderer.render(scene, camera);
}
requestAnimationFrame(tick);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// Face The Pocket from Gate
controls.getObject().rotation.y = Math.PI;
</script>
</body>
</html>
