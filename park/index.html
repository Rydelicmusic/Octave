    const ax=b.x-Math.sin(yaw)*back;
    const az=b.z-Math.cos(yaw)*back;
    if(Math.abs(ax)<LOCK.spineWidth/2+1) return;
    if(nearRing(ax,az,6)) return;
    const g=new THREE.Group();
    const pad=new THREE.Mesh(new THREE.BoxGeometry(Math.min(b.w*0.85,6.5),0.12,2.4),apronMat);
    pad.position.y=0.06;g.add(pad);
    [-1,1].forEach(side=>{
      const c=new THREE.Mesh(new THREE.BoxGeometry(0.25,0.28,2.4),curbMat);
      c.position.set(side*(Math.min(b.w*0.85,6.5)/2+0.15),0.14,0);g.add(c);
    });
    const bump=new THREE.Mesh(new THREE.BoxGeometry(Math.min(b.w*0.5,3.2),0.35,0.35),new THREE.MeshLambertMaterial({color:0x3d3428}));
    bump.position.set(0,0.2,-1.0);g.add(bump);
    g.position.set(ax,0,az);g.rotation.y=yaw;scene.add(g);
  });
  GATE.forEach(wing=>{
    const yaw=wing.yaw||0;
    const back=wing.d/2+1.2;
    const ax=wing.x-Math.sin(yaw)*back;
    const az=wing.z-Math.cos(yaw)*back;
    const pad=new THREE.Mesh(new THREE.BoxGeometry(4.5,0.12,2.0),apronMat);
    pad.position.set(ax,0.06,az);pad.rotation.y=yaw;scene.add(pad);
  });
})();

// Pass 37 — evening window glow on SKUs (footprints unmoved)
(function windowGlowPass(){
  // Pass 52 — denser evening window glow (footprints unmoved; free fill vs PointLights)
  const glow=new THREE.MeshLambertMaterial({color:0xf0d090, emissive:0xc9a050, emissiveIntensity:0.78});
  BUILDINGS.forEach(b=>{
    const n=b.sku==='album'||b.sku==='hall'?10:b.sku==='pavilion'?6:4;
    for(let i=0;i<n;i++){
      const face=i%4;
      const u=(Math.floor(i/4)+0.5)/(Math.ceil(n/4)+0.01);
      let x=0,z=0,sx=0.7,sz=0.08;
      if(face===0){x=(u-0.5)*b.w*0.7;z=b.d/2+0.04;sx=Math.min(1.4,b.w*0.22);sz=0.08;}
      else if(face===1){x=(u-0.5)*b.w*0.7;z=-b.d/2-0.04;sx=Math.min(1.4,b.w*0.22);sz=0.08;}
      else if(face===2){z=(u-0.5)*b.d*0.7;x=b.w/2+0.04;sx=0.08;sz=Math.min(1.2,b.d*0.22);}
      else{z=(u-0.5)*b.d*0.7;x=-b.w/2-0.04;sx=0.08;sz=Math.min(1.2,b.d*0.22);}
      const pane=new THREE.Mesh(new THREE.BoxGeometry(sx,0.9,sz),glow);
      pane.position.set(b.x+x*Math.cos(b.yaw||0)-z*Math.sin(b.yaw||0), 1.35+((i%3)*0.15), b.z+x*Math.sin(b.yaw||0)+z*Math.cos(b.yaw||0));
      scene.add(pane);
    }
  });
})();
// Pass 52 — soft fill PointLights at walk signs + land pockets (shared LAMP_LIGHT_CAP)
(function pass52NightFill(){
  WALKS.forEach((w)=>{
    if(!w.sign) return;
    addLampPointLight(w.sign.x, w.sign.z, 4.5, 20);
  });
  // land canopy centers as dim fill (LAYOUT canopies held)
  const cans=LOCK.canopies||{};
  Object.values(cans).forEach((c)=>{
    if(!c||c.cx==null) return;
    addLampPointLight(c.cx, c.cz, 3.5, 28);
  });
  // mid-spine soft fill between denser poles (cap may drop late ones)
  for(let z=40;z<LOCK.gate.z-20;z+=42){
    addLampPointLight(0, z, 3.2, 24);
  }
})();
// Pass 63 — local night mist near waters (waters x/z/rx/rz held; soft volume only)
(function pass63WaterMist(){
  if(window.__PARK_DRY) return;
  const mistMat=new THREE.MeshLambertMaterial({
    color:0xb8c8d8, emissive:0x4a6078, emissiveIntensity:0.22,
    transparent:true, opacity:0.18, depthWrite:false
  });
  LOCK.waters.forEach(([cx,cz,rx,rz])=>{
    // low dome-ish stack of translucent discs just above water
    for(let i=0;i<3;i++){
      const t=0.55+i*0.18;
      const disc=new THREE.Mesh(new THREE.CircleGeometry(1,48), mistMat.clone());
      disc.material.opacity=0.14-i*0.03;
      disc.rotation.x=-Math.PI/2;
      disc.position.set(cx, 0.55+i*0.85, cz);
      disc.scale.set(rx*t, rz*t, 1);
      scene.add(disc);
    }
    // shore wisps — thin vertical cards around rim (skip spine)
    for(let a=0;a<Math.PI*2;a+=Math.PI/5){
      const x=cx+Math.cos(a)*rx*1.05;
      const z=cz+Math.sin(a)*rz*1.05;
      if(Math.abs(x)<LOCK.spineWidth/2+2) continue;
      const card=new THREE.Mesh(new THREE.PlaneGeometry(rx*0.35, 2.2), mistMat.clone());
      card.material.opacity=0.12;
      card.position.set(x, 1.1, z);
      card.lookAt(cx, 1.1, cz);
      scene.add(card);
    }
  });
})();
(function landWash(){
  // land wash — readable from Walk eye height and Drone ~90 m
  const washes=[
    {c:LOCK.canopies['The Block'],col:0x9bb56a,i:18,d:140},
    {c:LOCK.canopies['After Hours'],col:0x88a0c0,i:16,d:120},
    {c:LOCK.canopies['The Board'],col:0xc2b56a,i:17,d:130},
    {c:LOCK.canopies['The Pocket'],col:0xa8c090,i:15,d:110}
  ];
  washes.forEach(w=>{
    if(!w.c) return;
    const l=new THREE.PointLight(w.col,w.i,w.d);l.position.set(w.c.cx,26,w.c.cz);scene.add(l);
  });
})();
hubBedCenters().forEach(b=>{
  // planters at hub ring (plants only)
  const px=Math.cos(b.a)*30,pz=Math.sin(b.a)*30;
  if(!canPlaceSoft(px,pz,0.8))return;
  const pot=new THREE.Mesh(new THREE.CylinderGeometry(0.55,0.45,0.5,10),stone);
  pot.position.set(px,0.25,pz);scene.add(pot);
  const dirt=new THREE.Mesh(new THREE.CircleGeometry(0.48,10),earthMat);
  dirt.rotation.x=-Math.PI/2;dirt.position.set(px,0.51,pz);scene.add(dirt);
  const plant=new THREE.Mesh(new THREE.SphereGeometry(0.42,8,6),leafHi);
  plant.position.set(px,0.85,pz);plant.scale.set(1,0.75,1);scene.add(plant);
});
const ropeMat=new THREE.MeshLambertMaterial({color:0xc9b48a});
const ropes=[];
for(let z=36;z<B-8;z+=8){
  for(const side of [-1,1]){
    const x=side*(LOCK.spineWidth/2+1.55);
    if(!canPlaceSoft(x,z,0.2))continue;
    ropes.push({x,z,side});
    const post=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.06,0.95,6),stoneDark);
    post.position.set(x,0.48,z);scene.add(post);
  }
}
ropes.forEach((p,i)=>{
  const q=ropes[i+1];
  if(!q||q.side!==p.side)return;
  const dx=q.x-p.x,dz=q.z-p.z,len=Math.hypot(dx,dz);
  if(len>12)return;
  const rope=new THREE.Mesh(new THREE.CylinderGeometry(0.025,0.025,len,4),ropeMat);
  rope.position.set((p.x+q.x)/2,0.82,(p.z+q.z)/2);
  rope.rotation.z=Math.atan2(dx,dz);rope.rotation.x=Math.PI/2;scene.add(rope);
});
addHubClean(THREE,scene);
addWaterClean(THREE,scene);
addDryPark(THREE,scene);
addTidyOval(THREE,scene);
addNoWater(THREE,scene);
const parkGrid=addParkGrid(THREE,scene);

const avatar=new THREE.Group();
const body=new THREE.Mesh(new THREE.CapsuleGeometry(0.38,1.05,4,8),new THREE.MeshLambertMaterial({color:0xc9b48a}));body.position.y=0.9;
const head=new THREE.Mesh(new THREE.SphereGeometry(0.28,12,12),new THREE.MeshLambertMaterial({color:0xe8d7b0}));head.position.y=1.72;
avatar.add(body,head);scene.add(avatar);
const keys={};
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyV')cycle();});
addEventListener('keyup',e=>keys[e.code]=false);
const modes=['walk','third','above'];
const btns={walk:document.getElementById('b1'),third:document.getElementById('b3'),above:document.getElementById('bM')};
function setMode(m){const was=mode==='above'||mode==='drone';const aerial=m==='above'||m==='drone';if(was&&!aerial){pos.x=drone.x;pos.z=drone.z;pos.y=EYE;}mode=m;Object.keys(btns).forEach(k=>btns[k].classList.toggle('on',k===m));scene.fog.far=m==='above'?1800:900;camera.fov=m==='above'?62:70;camera.updateProjectionMatrix();document.getElementById('lift').style.display=m==='above'?'flex':'none';if(aerial&&!was){drone.set(pos.x,Math.max(24,drone.y||90),pos.z);droneYaw=yaw;dronePitch=-0.72;droneVel.set(0,0,0);}parkGrid.setMode(m);window.__parkGpsGet=()=>((mode==='above'||mode==='drone')?drone:pos);}
function cycle(){setMode(modes[(modes.indexOf(mode)+1)%3]);}
btns.walk.onclick=()=>setMode('walk');btns.third.onclick=()=>setMode('third');btns.above.onclick=()=>setMode('above');
if(location.hash==='#drone')setMode('above');
let look=false,lx=0,ly=0;
canvas.addEventListener('pointerdown',e=>{look=true;lx=e.clientX;ly=e.clientY;canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointerup',()=>look=false);
canvas.addEventListener('pointermove',e=>{if(!look)return;const dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;if(mode==='above'){droneYaw-=dx*0.0045;dronePitch-=dy*0.0035;dronePitch=Math.max(-1.45,Math.min(0.35,dronePitch));}else{yaw-=dx*0.005;pitch-=dy*0.005;pitch=Math.max(-1.15,Math.min(1.15,pitch));}});
canvas.addEventListener('wheel',e=>{if(mode!=='above')return;drone.y=Math.max(8,Math.min(420,drone.y+e.deltaY*0.12));},{passive:true});
const pad=document.getElementById('pad'),knob=document.getElementById('knob');const stick={x:0,z:0};
function setStick(cx,cy){const r=pad.getBoundingClientRect();let dx=(cx-(r.left+r.width/2))/42,dy=(cy-(r.top+r.height/2))/42;const m=Math.hypot(dx,dy)||1;if(m>1){dx/=m;dy/=m;}stick.x=dx;stick.z=dy;knob.style.left=39+dx*28+'px';knob.style.top=39+dy*28+'px';}
function clearStick(){stick.x=0;stick.z=0;knob.style.left='39px';knob.style.top='39px';}
pad.addEventListener('pointerdown',e=>{e.stopPropagation();setStick(e.clientX,e.clientY);pad.setPointerCapture(e.pointerId);});
pad.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')setStick(e.clientX,e.clientY);});
pad.addEventListener('pointerup',clearStick);pad.addEventListener('pointercancel',clearStick);
function hold(el,dir){const on=e=>{e.preventDefault();lift=dir;};const off=()=>{if(lift===dir)lift=0;};el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);el.addEventListener('pointerleave',off);el.addEventListener('pointercancel',off);}
hold(document.getElementById('up'),1);hold(document.getElementById('dn'),-1);
const landEl=document.getElementById('land'),distEl=document.getElementById('dist');
function whichLand(x,z){if(Math.hypot(x,z)<36)return 'The Pocket · Hub';if(z>40&&Math.abs(x)<20)return 'The Pocket · Corridor';if(x<-60)return 'The Block';if(x>70)return 'The Board';if(z<-50)return 'After Hours';return 'The Pocket';}
const clock=new THREE.Clock();
function tick(){
  const dt=Math.min(clock.getDelta(),0.05);
  let mx=stick.x,mz=stick.z;
  if(keys.KeyW)mz-=1;if(keys.KeyS)mz+=1;if(keys.KeyA)mx-=1;if(keys.KeyD)mx+=1;
  const len=Math.hypot(mx,mz);
  if(mode==='above'){
    const fx=-Math.sin(droneYaw),fz=-Math.cos(droneYaw),rx=Math.cos(droneYaw),rz=-Math.sin(droneYaw);
    const spd=(keys.ShiftLeft||keys.ShiftRight)?DRONE_FAST:DRONE;
    let tx=0,tz=0,ty=0;
    if(len>0){mx/=len;mz/=len;tx=(fx*-mz+rx*mx)*spd;tz=(fz*-mz+rz*mx)*spd;}
    if(keys.KeyQ||keys.Space||lift>0)ty+=spd*0.55;
    if(keys.KeyE||keys.ControlLeft||lift<0)ty-=spd*0.55;
    droneVel.x+=(tx-droneVel.x)*Math.min(1,dt*6);
    droneVel.z+=(tz-droneVel.z)*Math.min(1,dt*6);
    droneVel.y+=(ty-droneVel.y)*Math.min(1,dt*6);
    drone.x+=droneVel.x*dt;drone.z+=droneVel.z*dt;drone.y=Math.max(8,Math.min(420,drone.y+droneVel.y*dt));
  }else if(len>0){
    mx/=len;mz/=len;const fx=-Math.sin(yaw),fz=-Math.cos(yaw),rx=Math.cos(yaw),rz=-Math.sin(yaw);
    const spd=WALK*((keys.ShiftLeft||keys.ShiftRight)?10:5);
    const stepX=(fx*-mz+rx*mx)*spd*dt,stepZ=(fz*-mz+rz*mx)*spd*dt;
    walkVelX=stepX;walkVelZ=stepZ;
    const nx=pos.x+stepX,nz=pos.z+stepZ;
    if (inStadium(nx,nz) && !(window.__blockWalk && window.__blockWalk(nx,nz))) { pos.x=nx; pos.z=nz; }
  }
  const grade=window.__groundY?window.__groundY(pos.x,pos.z):0;pos.y=EYE+grade;avatar.position.set(pos.x,grade,pos.z);avatar.rotation.y=yaw;avatar.visible=mode!=='walk';
  if(mode==='walk'){camera.position.copy(pos);camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;}
  else if(mode==='third'){camera.position.set(pos.x+Math.sin(yaw)*5.2,pos.y+2.1+pitch*-1.2,pos.z+Math.cos(yaw)*5.2);camera.lookAt(pos.x,pos.y-0.1,pos.z);}
  else{camera.position.copy(drone);camera.rotation.order='YXZ';camera.rotation.y=droneYaw;camera.rotation.x=dronePitch;}
  const hx=mode==='above'?drone.x:pos.x,hz=mode==='above'?drone.z:pos.z;
  landEl.textContent=whichLand(hx,hz)+' · '+(mode==='walk'?'WALK':mode==='third'?'3RD':'DRONE');
  distEl.textContent=mode==='above'?('Alt '+drone.y.toFixed(0)+' m · hub '+Math.hypot(drone.x,drone.z).toFixed(0)+' m'):('Hub '+Math.hypot(pos.x,pos.z).toFixed(0)+' m');
  if(window.__tickRides)window.__tickRides();if(window.__applyRideCam)window.__applyRideCam(camera);renderer.render(scene,camera);requestAnimationFrame(tick);
}
tick();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script>
