function pathRibbon(pts,width=6){

  }
  for(let i=0;i<segs;i++){const a=i*2;idx.push(a,a+1,a+2,a+1,a+3,a+2);}

      const sx=-tg.z,sz=tg.x,len=Math.hypot(sx,sz)||1;

  });

function arcWall(innerR,outerR,h,y0,a0,a1,mat){

  const shape=new THREE.Shape();

  else if(mode==='third'){camera.position.set(pos.x+Math.sin(yaw)*5.2,pos.y+2.1+pitch*-1.2,pos.z+Math.cos(yaw)*5.2);camera.lookAt(pos.x,pos.y-0.1,pos.z);}
  else{camera.position.copy(drone);camera.rotation.order='YXZ';camera.rotation.y=droneYaw;camera.rotation.x=dronePitch;}
  const hx=mode==='above'?drone.x:pos.x,hz=mode==='above'?drone.z:pos.z;
  landEl.textContent=whichLand(hx,hz)+' · '+(mode==='walk'?'WALK':mode==='third'?'3RD':'DRONE');
  distEl.textContent=mode==='above'?('Alt '+drone.y.toFixed(0)+' m · hub '+Math.hypot(drone.x,drone.z).toFixed(0)+' m'):('Hub '+Math.hypot(pos.x,pos.z).toFixed(0)+' m');
  renderer.render(scene,camera);requestAnimationFrame(tick);
}
pos.y=EYE;camera.position.copy(pos);camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;
renderer.render(scene,camera);
tick();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
} catch (err) {
  const el=document.getElementById('dist');
  if(el) el.textContent=String(err && err.message || err);
  console.error(err);
}
</script>
</body>
</html>
